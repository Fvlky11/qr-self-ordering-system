<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - QR Self-Ordering</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Navbar -->
    <nav class="bg-gray-900 text-white px-6 py-4 shadow">
        <div class="max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-bold text-orange-400">Admin Panel Resto</h1>
            <div class="flex gap-2">
                <button onclick="switchTab('tables')" id="tab-tables" class="px-4 py-1.5 rounded-lg bg-orange-600 text-sm font-semibold">QR Meja</button>
                <button onclick="switchTab('products')" id="tab-products" class="px-4 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold">Kelola Menu</button>
                <button onclick="switchTab('reports')" id="tab-reports" class="px-4 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold">Laporan Omzet</button>
                <a href="/kitchen.html" target="_blank" class="px-4 py-1.5 rounded-lg bg-green-600 hover:bg-green-700 text-sm font-semibold">Buka Layar Dapur ↗</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        <!-- SECTION 1: QR MEJA -->
        <section id="section-tables">
            <form id="tableForm" class="flex gap-3 mb-6 bg-white p-4 rounded-xl shadow-sm">
                <input type="text" id="tableNumber" placeholder="Nomor Meja (misal: 02)" required
                       class="border rounded-lg px-4 py-2 flex-1 focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button type="submit" class="bg-orange-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-orange-700">
                    + Buat QR Meja
                </button>
            </form>
            <div id="tablesGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- SECTION 2: KELOLA MENU -->
        <section id="section-products" class="hidden">
            <form id="productForm" class="bg-white p-5 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-4 gap-3">
                <select id="prodCategory" required class="border rounded-lg px-3 py-2 bg-white"></select>
                <input type="text" id="prodName" placeholder="Nama Menu" required class="border rounded-lg px-3 py-2">
                <input type="number" id="prodPrice" placeholder="Harga (Rp)" required class="border rounded-lg px-3 py-2">
                <div class="flex gap-2">
                    <input type="text" id="prodImage" placeholder="URL Gambar (Opsional)" class="border rounded-lg px-3 py-2 flex-1">
                    <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-orange-700">+ Simpan</button>
                </div>
            </form>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b text-xs uppercase text-gray-500">
                        <tr>
                            <th class="p-4">Menu</th>
                            <th class="p-4">Kategori</th>
                            <th class="p-4">Harga</th>
                            <th class="p-4">Status Stok</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable" class="divide-y text-sm"></tbody>
                </table>
            </div>
        </section>

        <!-- SECTION 3: LAPORAN OMZET -->
        <section id="section-reports" class="hidden">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                    <p class="text-sm text-gray-500">Total Omzet Lunas</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" id="repRevenue">Rp 0</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">Total Transaksi Berhasil</p>
                    <p class="text-3xl font-bold text-gray-900 mt-1" id="repOrders">0 Pesanan</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="p-4 border-b font-bold text-gray-700">Riwayat 20 Transaksi Terakhir</div>
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50 border-b text-xs uppercase text-gray-500">
                        <tr>
                            <th class="p-4">Kode Order</th>
                            <th class="p-4">Meja</th>
                            <th class="p-4">Pelanggan</th>
                            <th class="p-4">Total</th>
                            <th class="p-4">Status Dapur</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTable" class="divide-y text-sm"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tab) {
            ['tables', 'products', 'reports'].forEach(t => {
                document.getElementById(`section-${t}`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                btn.className = t === tab 
                    ? 'px-4 py-1.5 rounded-lg bg-orange-600 text-sm font-semibold' 
                    : 'px-4 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm font-semibold';
            });
            if (tab === 'tables') loadTables();
            if (tab === 'products') loadProducts();
            if (tab === 'reports') loadReports();
        }

        // --- TAB 1: MEJA & QR ---
        async function loadTables() {
            const res = await fetch('/api/tables');
            const tables = await res.json();
            document.getElementById('tablesGrid').innerHTML = tables.map(t => `
                <div class="bg-white p-5 rounded-xl shadow-sm text-center flex flex-col items-center">
                    <span class="text-lg font-bold bg-gray-900 text-white px-4 py-1 rounded-full mb-3">Meja ${t.table_number}</span>
                    <img src="${t.qrImage}" alt="QR Meja ${t.table_number}" class="w-44 h-44 mb-3">
                    <a href="${t.orderUrl}" target="_blank" class="text-sm text-blue-600 underline mb-3">Buka Link Simulasi Scan</a>
                    <button onclick="resetTableToken(${t.id})" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg border">
                        Reset Token QR
                    </button>
                </div>
            `).join('');
        }

        document.getElementById('tableForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const table_number = document.getElementById('tableNumber').value;
            const res = await fetch('/api/tables', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table_number })
            });
            if (res.ok) {
                document.getElementById('tableNumber').value = '';
                loadTables();
            } else {
                const err = await res.json();
                alert(err.error);
            }
        });

        async function resetTableToken(id) {
            if (!confirm('Reset token QR meja ini? Link QR lama akan langsung tidak berlaku.')) return;
            await fetch(`/api/admin/tables/${id}/reset-token`, { method: 'PATCH' });
            loadTables();
        }

        // --- TAB 2: PRODUK ---
        async function loadProducts() {
            const res = await fetch('/api/admin/products');
            const data = await res.json();

            document.getElementById('prodCategory').innerHTML = data.categories.map(c => 
                `<option value="${c.id}">${c.name}</option>`
            ).join('');

            document.getElementById('productsTable').innerHTML = data.products.map(p => `
                <tr>
                    <td class="p-4 flex items-center gap-3">
                        <img src="${p.image_url}" class="w-10 h-10 rounded object-cover bg-gray-200">
                        <span class="font-semibold">${p.name}</span>
                    </td>
                    <td class="p-4 text-gray-600">${p.category_name || '-'}</td>
                    <td class="p-4 font-semibold">Rp ${p.price.toLocaleString('id-ID')}</td>
                    <td class="p-4">
                        <button onclick="toggleStock(${p.id})" 
                                class="px-3 py-1 rounded-full text-xs font-bold ${p.is_available ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${p.is_available ? 'Tersedia' : 'Stok Habis'}
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                category_id: document.getElementById('prodCategory').value,
                name: document.getElementById('prodName').value,
                price: Number(document.getElementById('prodPrice').value),
                image_url: document.getElementById('prodImage').value
            };
            await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            e.target.reset();
            loadProducts();
        });

        async function toggleStock(id) {
            await fetch(`/api/admin/products/${id}/toggle`, { method: 'PATCH' });
            loadProducts();
        }

        // --- TAB 3: LAPORAN ---
        async function loadReports() {
            const res = await fetch('/api/admin/reports');
            const data = await res.json();
            document.getElementById('repRevenue').innerText = `Rp ${Number(data.summary.total_revenue).toLocaleString('id-ID')}`;
            document.getElementById('repOrders').innerText = `${data.summary.total_orders} Pesanan`;

            document.getElementById('reportsTable').innerHTML = data.recentOrders.map(o => `
                <tr>
                    <td class="p-4 font-mono text-xs">${o.order_code}</td>
                    <td class="p-4 font-bold">Meja ${o.table_number}</td>
                    <td class="p-4">${o.customer_name}</td>
                    <td class="p-4 font-semibold text-green-700">Rp ${o.total_amount.toLocaleString('id-ID')}</td>
                    <td class="p-4 uppercase text-xs font-bold text-gray-600">${o.order_status}</td>
                </tr>
            `).join('');
        }

        loadTables();
    </script>
</body>
</html>
