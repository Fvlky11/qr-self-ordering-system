<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System (KDS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-5 md:p-6">
    <header class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-orange-600 flex items-center justify-center font-extrabold text-white shadow-lg shadow-orange-600/30">
                KDS
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight text-white">Kitchen Display System</h1>
                <p class="text-xs text-slate-400">Antrean pesanan lunas siap dimasak</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="activeCount" class="bg-slate-900 border border-slate-800 text-xs font-bold px-3.5 py-1.5 rounded-xl text-slate-300">0 Antrean</span>
            <span class="bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold px-3.5 py-1.5 rounded-xl flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Sync
            </span>
        </div>
    </header>

    <div id="emptyState" class="hidden text-center py-24">
        <p class="text-slate-500 font-bold text-base">Belum ada pesanan masuk saat ini</p>
        <p class="text-slate-600 text-xs mt-1">Pesanan baru otomatis muncul begitu pelanggan selesai membayar.</p>
    </div>

    <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

    <script>
        const socket = typeof io !== 'undefined' ? io() : null;
        if (socket) {
            socket.emit('join_kitchen');
            socket.on('new_paid_order', () => loadExistingOrders());
        }

        async function loadExistingOrders() {
            const res = await fetch('/api/kitchen/orders');
            if (!res.ok) return;
            const orders = await res.json();

            document.getElementById('activeCount').innerText = `${orders.length} Antrean`;
            document.getElementById('emptyState').classList.toggle('hidden', orders.length > 0);

            const activeIds = orders.map(o => `order-${o.id}`);
            document.querySelectorAll('#ordersGrid > div').forEach(el => {
                if (!activeIds.includes(el.id)) el.remove();
            });

            orders.forEach(renderOrderCard);
        }

        function renderOrderCard(order) {
            const existing = document.getElementById(`order-${order.id}`);
            if (existing) existing.remove();

            const grid = document.getElementById('ordersGrid');
            const itemsHtml = order.items.map(i => `
                <li class="border-b border-slate-800/80 py-2 last:border-none">
                    <div class="flex justify-between items-start gap-2">
                        <span class="text-sm font-semibold text-slate-100"><b class="text-orange-400 mr-1">${i.quantity}x</b> ${i.name}</span>
                    </div>
                    ${i.notes ? `<p class="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-lg px-2.5 py-1 mt-1.5">Catatan: ${i.notes}</p>` : ''}
                </li>
            `).join('');

            const isCooking = order.order_status === 'cooking';
            const timeStr = new Date(order.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            const card = document.createElement('div');
            card.id = `order-${order.id}`;
            card.className = `bg-slate-900 border ${isCooking ? 'border-amber-500/70' : 'border-orange-500/70'} rounded-2xl p-4 flex flex-col justify-between shadow-xl transition-all`;
            card.innerHTML = `
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-orange-600 text-white font-extrabold px-3 py-1 rounded-xl text-xs">Meja ${order.table_number}</span>
                        <span class="text-[11px] font-bold px-2.5 py-1 rounded-lg ${isCooking ? 'bg-amber-500/20 text-amber-300' : 'bg-blue-500/20 text-blue-300'}">
                            ${isCooking ? '🔥 Sedang Dimasak' : '🆕 Pesanan Baru'}
                        </span>
                    </div>
                    <div class="flex justify-between text-[11px] text-slate-400 mb-1">
                        <span>${order.order_code}</span>
                        <span>${timeStr}</span>
                    </div>
                    <p class="text-xs text-slate-300 mb-3 pb-2.5 border-b border-slate-800">Pemesan: <b class="text-white">${order.customer_name}</b></p>
                    <ul class="mb-4">${itemsHtml}</ul>
                </div>
                <div class="space-y-2 pt-2">
                    ${!isCooking ? `
                        <button onclick="updateStatus(${order.id}, 'cooking')" class="w-full bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 py-2.5 rounded-xl font-extrabold text-xs transition">
                            Mulai Masak
                        </button>
                    ` : ''}
                    <button onclick="updateStatus(${order.id}, 'served')" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white py-2.5 rounded-xl font-extrabold text-xs transition">
                        ✓ Selesai & Antar
                    </button>
                </div>
            `;
            grid.appendChild(card);
        }

        async function updateStatus(id, status) {
            // Optimistic UI: langsung hapus kartu saat 'served' tanpa menunggu jaringan
            if (status === 'served') {
                const el = document.getElementById(`order-${id}`);
                if (el) el.remove();
            }

            await fetch(`/api/kitchen/orders/${id}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            });

            loadExistingOrders();
        }

        setInterval(loadExistingOrders, 3000);
        loadExistingOrders();
    </script>
</body>
</html>
