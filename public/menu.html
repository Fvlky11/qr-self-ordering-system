<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pemesanan Meja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-32 selection:bg-orange-500 selection:text-white">
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900/95 backdrop-blur text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl transition-all"></div>

    <!-- Sticky Glass Header -->
    <header class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-200/70">
        <div class="max-w-lg mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center text-white font-extrabold shadow-md shadow-orange-500/25">
                    KR
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-slate-900">Kedai Kopi & Resto</h1>
                    <div class="flex items-center gap-1.5 text-xs text-slate-500 font-medium">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="tableInfo">Menghubungkan meja...</span>
                    </div>
                </div>
            </div>
            <span id="tableBadge" class="hidden bg-orange-50 text-orange-600 border border-orange-200/80 text-xs font-bold px-3 py-1.5 rounded-xl">
                Meja -
            </span>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 pt-4">
        <!-- Card Nama Pemesan & Pencarian -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-4 space-y-3">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Nama Pemesan</label>
                <div class="relative">
                    <input type="text" id="customerName" placeholder="Ketik nama kamu di sini..." 
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3.5 pr-4 py-2.5 text-sm font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-500 transition">
                </div>
            </div>
            <div class="relative">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="Cari menu favorit..." 
                       class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-sm focus:bg-white focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-500 transition">
            </div>
        </div>

        <!-- Filter Kategori -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-3 mb-2"></div>

        <!-- Daftar Menu (Skeleton Awal) -->
        <div id="menuList" class="space-y-3">
            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 flex gap-3.5 animate-pulse">
                <div class="w-24 h-24 rounded-xl bg-slate-200"></div>
                <div class="flex-1 space-y-2.5 py-1">
                    <div class="h-3 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-3/4"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                </div>
            </div>
            <div class="bg-white p-3.5 rounded-2xl border border-slate-100 flex gap-3.5 animate-pulse">
                <div class="w-24 h-24 rounded-xl bg-slate-200"></div>
                <div class="flex-1 space-y-2.5 py-1">
                    <div class="h-3 bg-slate-200 rounded w-1/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-2/3"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="cartBar" class="hidden fixed bottom-4 inset-x-4 z-30 animate-slide-up">
        <div class="max-w-lg mx-auto bg-slate-900/95 backdrop-blur-md text-white p-3.5 rounded-2xl shadow-2xl shadow-slate-900/30 border border-white/10 flex justify-between items-center">
            <div onclick="openCartModal()" class="cursor-pointer pl-1">
                <div class="flex items-center gap-2">
                    <span class="bg-orange-500 text-white text-xs font-extrabold px-2 py-0.5 rounded-md" id="totalQty">0</span>
                    <span class="text-xs text-slate-300 font-medium">Item • Ketuk rincian</span>
                </div>
                <p class="font-extrabold text-lg tracking-tight mt-0.5" id="totalPrice">Rp 0</p>
            </div>
            <button onclick="checkout()" id="payBtn" class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 active:scale-95 text-white px-5 py-3 rounded-xl font-bold text-sm shadow-lg shadow-orange-500/30 transition flex items-center gap-2">
                <span>Bayar Sekarang</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>
    </div>

    <!-- Cart Review Drawer Modal -->
    <div id="cartModal" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-xs flex items-end justify-center">
        <div class="bg-white w-full max-w-lg rounded-t-3xl p-5 max-h-[80vh] flex flex-col animate-slide-up">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-extrabold text-lg text-slate-900">Ringkasan Pesanan</h3>
                <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">✕</button>
            </div>
            <div id="cartModalItems" class="overflow-y-auto divide-y divide-slate-100 my-3 flex-1"></div>
            <button onclick="closeCartModal(); checkout();" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-orange-600/25 transition">
                Lanjut ke Pembayaran
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const table = params.get('table');
        const token = params.get('token');
        let products = [];
        let activeCategory = 'Semua';
        let searchQuery = '';
        let cart = {};

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.innerText = msg;
            el.classList.remove('hidden');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.add('hidden'), 2600);
        }

        async function init() {
            try {
                // Parallel fetch agar loading 2x lebih cepat
                const [cfgRes, menuRes] = await Promise.all([
                    fetch('/api/config'),
                    fetch(`/api/menu?table=${table}&token=${token}`)
                ]);

                if (!menuRes.ok) {
                    document.body.innerHTML = `
                        <div class="min-h-screen flex items-center justify-center p-6">
                            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 text-center max-w-sm">
                                <div class="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-4 text-2xl font-bold">!</div>
                                <h2 class="font-extrabold text-lg text-slate-900">QR Code Tidak Valid</h2>
                                <p class="text-sm text-slate-500 mt-1">Silakan scan ulang QR Code yang tertera di meja restoran.</p>
                            </div>
                        </div>`;
                    return;
                }

                const [cfg, data] = await Promise.all([cfgRes.json(), menuRes.json()]);

                const snapScript = document.createElement('script');
                snapScript.src = 'https://app.sandbox.midtrans.com/snap/snap.js';
                snapScript.setAttribute('data-client-key', cfg.clientKey);
                document.head.appendChild(snapScript);

                document.getElementById('tableInfo').innerText = `Siap menerima pesanan`;
                const badge = document.getElementById('tableBadge');
                badge.innerText = `Meja ${data.table.table_number}`;
                badge.classList.remove('hidden');

                products = data.products;
                renderCategories();
                renderMenu();
            } catch (err) {
                showToast('Gagal memuat menu. Periksa koneksi internet.');
            }
        }

        function renderCategories() {
            const categories = ['Semua', ...new Set(products.map(p => p.category_name).filter(Boolean))];
            document.getElementById('categoryTabs').innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                        class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all active:scale-95 ${
                            activeCategory === cat 
                            ? 'bg-slate-900 text-white shadow-sm' 
                            : 'bg-white text-slate-600 border border-slate-200/80 hover:border-slate-300'
                        }">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderMenu();
        }

        function renderMenu() {
            const filtered = products.filter(p => {
                const matchCat = activeCategory === 'Semua' || p.category_name === activeCategory;
                const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery);
                return matchCat && matchSearch;
            });

            const container = document.getElementById('menuList');
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-sm text-slate-400 font-medium">Menu tidak ditemukan.</div>`;
                return;
            }

            container.innerHTML = filtered.map(p => {
                const item = cart[p.id] || { quantity: 0, notes: '' };
                return `
                <div class="bg-white p-3.5 rounded-2xl shadow-xs border border-slate-100 hover:border-orange-200/80 transition-all">
                    <div class="flex gap-3.5 items-center">
                        <img src="${p.image_url}" loading="lazy" alt="${p.name}" class="w-22 h-22 w-[88px] h-[88px] object-cover rounded-xl bg-slate-100 shrink-0">
                        <div class="flex-1 min-w-0">
                            <span class="inline-block text-[10px] uppercase tracking-wider text-orange-600 bg-orange-50 px-2 py-0.5 rounded-md font-bold mb-1">${p.category_name}</span>
                            <h3 class="font-bold text-slate-900 text-sm leading-snug truncate">${p.name}</h3>
                            <p class="text-sm font-extrabold text-slate-800 mt-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                            
                            <div class="mt-2.5 flex justify-end">
                                ${item.quantity === 0 ? `
                                    <button onclick="updateQty(${p.id}, 1)" class="px-4 py-1.5 rounded-xl bg-orange-50 hover:bg-orange-600 text-orange-600 hover:text-white font-bold text-xs transition active:scale-95">
                                        + Tambah
                                    </button>
                                ` : `
                                    <div class="flex items-center gap-2.5 bg-slate-100 p-1 rounded-xl">
                                        <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 rounded-lg bg-white text-slate-700 font-extrabold shadow-2xs active:scale-90 transition">-</button>
                                        <span class="w-5 text-center font-extrabold text-xs text-slate-900">${item.quantity}</span>
                                        <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 rounded-lg bg-orange-600 text-white font-extrabold shadow-2xs active:scale-90 transition">+</button>
                                    </div>
                                `}
                            </div>
                        </div>
                    </div>
                    ${item.quantity > 0 ? `
                        <div class="mt-3 pt-2.5 border-t border-slate-100">
                            <input type="text" value="${item.notes}" oninput="updateNotes(${p.id}, this.value)"
                                   placeholder="Catatan: pedas, tanpa bawang, es sedikit..."
                                   class="w-full text-xs bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2 focus:bg-white focus:outline-none focus:border-orange-400 transition">
                        </div>
                    ` : ''}
                </div>
            `}).join('');
        }

        function updateQty(id, delta) {
            if (!cart[id]) cart[id] = { quantity: 0, notes: '' };
            cart[id].quantity += delta;
            if (cart[id].quantity <= 0) delete cart[id];
            renderMenu();
            updateCartBar();
        }

        function updateNotes(id, text) {
            if (cart[id]) cart[id].notes = text;
        }

        function updateCartBar() {
            let totalQty = 0, totalPrice = 0;
            for (const [id, item] of Object.entries(cart)) {
                const prod = products.find(p => p.id == id);
                if (prod) {
                    totalQty += item.quantity;
                    totalPrice += prod.price * item.quantity;
                }
            }
            const bar = document.getElementById('cartBar');
            if (totalQty > 0) {
                bar.classList.remove('hidden');
                document.getElementById('totalQty').innerText = totalQty;
                document.getElementById('totalPrice').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                bar.classList.add('hidden');
            }
        }

        function openCartModal() {
            const container = document.getElementById('cartModalItems');
            container.innerHTML = Object.entries(cart).map(([id, item]) => {
                const prod = products.find(p => p.id == id);
                return `
                <div class="py-3 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm text-slate-900">${item.quantity}x ${prod.name}</p>
                        ${item.notes ? `<p class="text-xs text-slate-500">Catatan: ${item.notes}</p>` : ''}
                    </div>
                    <span class="font-bold text-sm text-slate-800">Rp ${(prod.price * item.quantity).toLocaleString('id-ID')}</span>
                </div>`;
            }).join('');
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cartModal').classList.add('hidden');
        }

        async function checkout() {
            const customerInput = document.getElementById('customerName');
            const customer_name = customerInput.value.trim();
            if (!customer_name) {
                customerInput.focus();
                customerInput.classList.add('ring-2', 'ring-red-400', 'border-red-400');
                setTimeout(() => customerInput.classList.remove('ring-2', 'ring-red-400', 'border-red-400'), 1500);
                return showToast('Isi nama pemesan terlebih dahulu!');
            }

            const btn = document.getElementById('payBtn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> Memproses...`;

            try {
                const items = Object.entries(cart).map(([product_id, item]) => ({
                    product_id: Number(product_id),
                    quantity: item.quantity,
                    notes: item.notes
                }));

                const res = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ table_number: table, qr_token: token, customer_name, items })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Checkout gagal');

                window.snap.pay(data.snap_token, {
                    onSuccess: async function() {
                        await fetch(`/api/orders/${data.order_code}/verify`, { method: 'POST' });
                        window.location.href = `/order-status.html?code=${data.order_code}`;
                    },
                    onPending: function() {
                        showToast('Menunggu pembayaran diselesaikan.');
                    },
                    onError: function() {
                        showToast('Pembayaran gagal diproses.');
                    }
                });
            } catch (err) {
                showToast(err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        init();
    </script>
</body>
</html>
