<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Pemesanan Meja</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 pb-28">
    <header class="bg-orange-600 text-white p-4 sticky top-0 z-10 shadow">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <h1 class="font-bold text-lg">Kedai Kopi & Resto</h1>
                <p id="tableInfo" class="text-sm text-orange-100">Memuat meja...</p>
            </div>
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pemesan</label>
            <input type="text" id="customerName" placeholder="Masukkan nama kamu..." 
                   class="w-full border rounded-lg px-3 py-2 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <!-- Filter Kategori -->
        <div id="categoryTabs" class="flex gap-2 overflow-x-auto pb-3 mb-3"></div>

        <!-- Daftar Menu -->
        <div id="menuList" class="space-y-4"></div>
    </main>

    <!-- Floating Cart Bar -->
    <div id="cartBar" class="hidden fixed bottom-0 inset-x-0 bg-white border-t p-4 shadow-lg">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500"><span id="totalQty">0</span> Item dipilih</p>
                <p class="font-bold text-lg text-gray-900" id="totalPrice">Rp 0</p>
            </div>
            <button onclick="checkout()" id="payBtn" class="bg-orange-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-orange-700">
                Bayar Sekarang
            </button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const table = params.get('table');
        const token = params.get('token');
        let products = [];
        let activeCategory = 'Semua';
        let cart = {}; // { productId: { quantity: 1, notes: '' } }

        async function init() {
            const cfgRes = await fetch('/api/config');
            const cfg = await cfgRes.json();

            const snapScript = document.createElement('script');
            snapScript.src = 'https://app.sandbox.midtrans.com/snap/snap.js';
            snapScript.setAttribute('data-client-key', cfg.clientKey);
            document.head.appendChild(snapScript);

            const res = await fetch(`/api/menu?table=${table}&token=${token}`);
            if (!res.ok) {
                document.body.innerHTML = `<div class="p-10 text-center text-red-600 font-bold">QR Code Meja Tidak Valid atau Kadaluarsa!</div>`;
                return;
            }
            const data = await res.json();
            document.getElementById('tableInfo').innerText = `Meja Nomor ${data.table.table_number}`;
            products = data.products;
            renderCategories();
            renderMenu();
        }

        function renderCategories() {
            const categories = ['Semua', ...new Set(products.map(p => p.category_name).filter(Boolean))];
            document.getElementById('categoryTabs').innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                        class="px-4 py-1.5 rounded-full text-sm font-semibold whitespace-nowrap ${activeCategory === cat ? 'bg-orange-600 text-white' : 'bg-white text-gray-700 border'}">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const filtered = activeCategory === 'Semua' ? products : products.filter(p => p.category_name === activeCategory);
            const container = document.getElementById('menuList');

            container.innerHTML = filtered.map(p => {
                const item = cart[p.id] || { quantity: 0, notes: '' };
                return `
                <div class="bg-white p-3 rounded-xl shadow-sm">
                    <div class="flex gap-4 items-center">
                        <img src="${p.image_url}" class="w-20 h-20 object-cover rounded-lg bg-gray-200">
                        <div class="flex-1">
                            <span class="text-xs text-orange-600 font-semibold">${p.category_name}</span>
                            <h3 class="font-bold text-gray-800">${p.name}</h3>
                            <p class="text-sm font-semibold text-gray-600">Rp ${p.price.toLocaleString('id-ID')}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${p.id}, -1)" class="w-8 h-8 rounded-full bg-gray-200 font-bold">-</button>
                            <span class="w-5 text-center font-semibold">${item.quantity}</span>
                            <button onclick="updateQty(${p.id}, 1)" class="w-8 h-8 rounded-full bg-orange-600 text-white font-bold">+</button>
                        </div>
                    </div>
                    ${item.quantity > 0 ? `
                        <input type="text" value="${item.notes}" onchange="updateNotes(${p.id}, this.value)"
                               placeholder="Catatan khusus (misal: pedas, tanpa bawang)..."
                               class="mt-2 w-full text-xs border rounded-lg px-3 py-1.5 bg-gray-50 focus:outline-none focus:border-orange-400">
                    ` : ''}
                </div>
            `}).join('');
        }

        function updateQty(id, delta) {
            if (!cart[id]) cart[id] = { quantity: 0, notes: '' };
            cart[id].quantity += delta;
            if (cart[id].quantity <= 0) delete cart[id];
            renderMenu();
            updateCartBar();
        }

        function updateNotes(id, text) {
            if (cart[id]) cart[id].notes = text;
        }

        function updateCartBar() {
            let totalQty = 0, totalPrice = 0;
            for (const [id, item] of Object.entries(cart)) {
                const prod = products.find(p => p.id == id);
                totalQty += item.quantity;
                totalPrice += prod.price * item.quantity;
            }
            const bar = document.getElementById('cartBar');
            if (totalQty > 0) {
                bar.classList.remove('hidden');
                document.getElementById('totalQty').innerText = totalQty;
                document.getElementById('totalPrice').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
            } else {
                bar.classList.add('hidden');
            }
        }

        async function checkout() {
            const customer_name = document.getElementById('customerName').value.trim();
            if (!customer_name) return alert('Silakan isi nama pemesan terlebih dahulu!');

            const items = Object.entries(cart).map(([product_id, item]) => ({
                product_id: Number(product_id),
                quantity: item.quantity,
                notes: item.notes
            }));

            const res = await fetch('/api/checkout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ table_number: table, qr_token: token, customer_name, items })
            });

            const data = await res.json();
            if (!res.ok) return alert(data.error);

            window.snap.pay(data.snap_token, {
                onSuccess: async function(result) {
                    await fetch(`/api/orders/${data.order_code}/verify`, { method: 'POST' });
                    window.location.href = `/order-status.html?code=${data.order_code}`;
                },
                onPending: function(result) {
                    alert('Menunggu pembayaran diselesaikan.');
                },
                onError: function(result) {
                    alert('Pembayaran gagal.');
                }
            });
        }

        init();
    </script>
</body>
</html>
