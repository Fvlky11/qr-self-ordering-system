<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan & Struk Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-md overflow-hidden">
        <div class="bg-orange-600 text-white p-5 text-center">
            <p class="text-xs uppercase tracking-wider text-orange-200">Struk Digital & Pelacakan</p>
            <h1 class="text-xl font-bold mt-1" id="orderCodeText">Memuat...</h1>
            <p class="text-sm mt-1" id="tableText">Meja -</p>
        </div>

        <!-- Tracker Status Real-Time -->
        <div class="p-6 border-b">
            <p class="text-xs text-gray-500 mb-3 font-semibold uppercase">Status Pesanan Saat Ini</p>
            <div id="statusBanner" class="p-4 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-center font-bold">
                Menunggu Konfirmasi...
            </div>
        </div>

        <!-- Rincian Item -->
        <div class="p-6">
            <div class="flex justify-between text-sm text-gray-600 mb-3">
                <span>Pemesan: <b id="customerText" class="text-gray-900">-</b></span>
                <span id="paymentBadge" class="px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700">LUNAS</span>
            </div>

            <ul id="itemsList" class="divide-y divide-gray-100 border-t border-b py-2 text-sm"></ul>

            <div class="flex justify-between items-center mt-4 pt-2">
                <span class="font-bold text-gray-700">Total Pembayaran</span>
                <span class="font-bold text-xl text-orange-600" id="totalText">Rp 0</span>
            </div>

            <a id="orderAgainBtn" href="#" class="mt-6 block w-full text-center bg-gray-900 text-white py-3 rounded-xl font-semibold hover:bg-gray-800">
                + Pesan Menu Lagi
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderCode = params.get('code');
        const socket = io();

        const statusMap = {
            waiting_payment: { text: 'Menunggu Pembayaran', style: 'bg-yellow-50 border-yellow-200 text-yellow-800' },
            new: { text: 'Pesanan Diterima Dapur (Dalam Antrean)', style: 'bg-blue-50 border-blue-200 text-blue-800' },
            cooking: { text: 'Sedang Dimasak oleh Koki...', style: 'bg-orange-50 border-orange-200 text-orange-800' },
            served: { text: 'Pesanan Selesai & Siap Diantar ke Meja!', style: 'bg-green-50 border-green-200 text-green-800' }
        };

        function updateStatusUI(status) {
            const info = statusMap[status] || statusMap.new;
            const banner = document.getElementById('statusBanner');
            banner.className = `p-4 rounded-xl border text-center font-bold transition-all ${info.style}`;
            banner.innerText = info.text;
        }

        async function loadOrder() {
            const res = await fetch(`/api/orders/${orderCode}`);
            if (!res.ok) return alert('Data pesanan tidak ditemukan.');
            const order = await res.json();

            document.getElementById('orderCodeText').innerText = order.order_code;
            document.getElementById('tableText').innerText = `Meja Nomor ${order.table_number}`;
            document.getElementById('customerText').innerText = order.customer_name;
            document.getElementById('totalText').innerText = `Rp ${order.total_amount.toLocaleString('id-ID')}`;
            document.getElementById('orderAgainBtn').href = `/menu.html?table=${order.table_number}&token=${order.qr_token}`;

            updateStatusUI(order.order_status);

            document.getElementById('itemsList').innerHTML = order.items.map(i => `
                <li class="py-2 flex justify-between">
                    <div>
                        <p class="font-semibold text-gray-800">${i.quantity}x ${i.name}</p>
                        ${i.notes ? `<p class="text-xs text-gray-500 italic">Catatan: ${i.notes}</p>` : ''}
                    </div>
                    <span class="font-medium text-gray-700">Rp ${(i.unit_price * i.quantity).toLocaleString('id-ID')}</span>
                </li>
            `).join('');

            // Bergabung ke room socket pesanan ini
            socket.emit('join_order', orderCode);
        }

        socket.on('order_status_updated', (data) => {
            updateStatusUI(data.order_status);
        });

        loadOrder();
    </script>
</body>
</html>
