<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status Pesanan & Struk Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen p-4 flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100 overflow-hidden">
        <!-- Header Struk -->
        <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white p-6 text-center relative">
            <span class="inline-block bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-[11px] font-bold px-3 py-1 rounded-full mb-2">
                ✓ Pembayaran Terverifikasi
            </span>
            <h1 class="text-lg font-extrabold tracking-tight" id="orderCodeText">Memuat Pesanan...</h1>
            <p class="text-xs text-slate-400 mt-1" id="tableText">Meja -</p>
        </div>

        <!-- Visual Progress Stepper -->
        <div class="p-6 border-b border-slate-100">
            <div class="grid grid-cols-3 gap-2 text-center mb-4">
                <div>
                    <div id="step1" class="h-1.5 rounded-full bg-orange-500 mb-1.5 transition-all"></div>
                    <span class="text-[11px] font-bold text-slate-700">Diterima</span>
                </div>
                <div>
                    <div id="step2" class="h-1.5 rounded-full bg-slate-200 mb-1.5 transition-all"></div>
                    <span class="text-[11px] font-bold text-slate-400" id="step2Label">Dimasak</span>
                </div>
                <div>
                    <div id="step3" class="h-1.5 rounded-full bg-slate-200 mb-1.5 transition-all"></div>
                    <span class="text-[11px] font-bold text-slate-400" id="step3Label">Diantar</span>
                </div>
            </div>

            <div id="statusBanner" class="p-3.5 rounded-2xl bg-blue-50 border border-blue-100 text-blue-800 text-center text-xs font-extrabold">
                Memuat status dapur...
            </div>
        </div>

        <!-- Rincian Item -->
        <div class="p-6">
            <div class="flex justify-between text-xs text-slate-500 mb-3">
                <span>Pemesan: <b id="customerText" class="text-slate-900">-</b></span>
                <span class="px-2.5 py-0.5 rounded-md text-[11px] font-extrabold bg-emerald-50 text-emerald-700">LUNAS</span>
            </div>

            <ul id="itemsList" class="divide-y divide-slate-100 border-t border-b border-slate-100 py-2 text-sm"></ul>

            <div class="flex justify-between items-center mt-4 pt-1">
                <span class="font-bold text-sm text-slate-600">Total Pembayaran</span>
                <span class="font-extrabold text-xl text-orange-600" id="totalText">Rp 0</span>
            </div>

            <a id="orderAgainBtn" href="#" class="mt-6 block w-full text-center bg-slate-900 hover:bg-slate-800 active:scale-95 text-white py-3.5 rounded-2xl font-bold text-sm transition shadow-lg shadow-slate-900/20">
                + Pesan Menu Lagi
            </a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const orderCode = params.get('code');
        const socket = typeof io !== 'undefined' ? io() : null;

        const statusMap = {
            waiting_payment: { step: 1, text: 'Menunggu Konfirmasi Pembayaran', style: 'bg-amber-50 border-amber-200 text-amber-800' },
            new: { step: 1, text: 'Pesanan Masuk Antrean Dapur', style: 'bg-blue-50 border-blue-200 text-blue-800' },
            cooking: { step: 2, text: '🔥 Koki Sedang Memasak Pesananmu...', style: 'bg-orange-50 border-orange-200 text-orange-800' },
            served: { step: 3, text: '🎉 Pesanan Selesai & Siap Diantar ke Meja!', style: 'bg-emerald-50 border-emerald-200 text-emerald-800' }
        };

        function updateStatusUI(status) {
            const info = statusMap[status] || statusMap.new;
            const banner = document.getElementById('statusBanner');
            banner.className = `p-3.5 rounded-2xl border text-center text-xs font-extrabold transition-all ${info.style}`;
            banner.innerText = info.text;

            document.getElementById('step2').className = `h-1.5 rounded-full mb-1.5 transition-all ${info.step >= 2 ? 'bg-orange-500' : 'bg-slate-200'}`;
            document.getElementById('step2Label').className = `text-[11px] font-bold ${info.step >= 2 ? 'text-slate-700' : 'text-slate-400'}`;
            document.getElementById('step3').className = `h-1.5 rounded-full mb-1.5 transition-all ${info.step >= 3 ? 'bg-emerald-500' : 'bg-slate-200'}`;
            document.getElementById('step3Label').className = `text-[11px] font-bold ${info.step >= 3 ? 'text-emerald-700' : 'text-slate-400'}`;
        }

        async function loadOrder() {
            const res = await fetch(`/api/orders/${orderCode}`);
            if (!res.ok) return;
            const order = await res.json();

            document.getElementById('orderCodeText').innerText = order.order_code;
            document.getElementById('tableText').innerText = `Meja Nomor ${order.table_number}`;
            document.getElementById('customerText').innerText = order.customer_name;
            document.getElementById('totalText').innerText = `Rp ${order.total_amount.toLocaleString('id-ID')}`;
            document.getElementById('orderAgainBtn').href = `/menu.html?table=${order.table_number}&token=${order.qr_token}`;

            updateStatusUI(order.order_status);

            document.getElementById('itemsList').innerHTML = order.items.map(i => `
                <li class="py-2.5 flex justify-between items-start gap-2">
                    <div>
                        <p class="font-bold text-slate-800 text-xs">${i.quantity}x ${i.name}</p>
                        ${i.notes ? `<p class="text-[11px] text-slate-500 italic mt-0.5">Catatan: ${i.notes}</p>` : ''}
                    </div>
                    <span class="font-bold text-xs text-slate-700">Rp ${(i.unit_price * i.quantity).toLocaleString('id-ID')}</span>
                </li>
            `).join('');
        }

        if (socket) {
            socket.emit('join_order', orderCode);
            socket.on('order_status_updated', (data) => updateStatusUI(data.order_status));
        }

        setInterval(loadOrder, 3000);
        loadOrder();
    </script>
</body>
</html>
